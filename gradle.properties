org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
kotlin.code.style=official
# Sandbox workaround (this VM only): Java's default dual-stack loopback sockets get
# reset here, which breaks Gradle/Kotlin daemon IPC. Force IPv4 stack in the daemons.
systemProp.java.net.preferIPv4Stack=true
kotlin.daemon.jvmargs=-Xmx2g -Djava.net.preferIPv4Stack=true
